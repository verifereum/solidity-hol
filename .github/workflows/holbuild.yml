name: holbuild

on:
  workflow_dispatch:
    inputs:
      skip-snapshot:
        description: 'Start without the Actions cache project snapshot, so theories come from the remote cache or are built'
        type: boolean
        default: false
  pull_request:
  merge_group:
  push:
    branches: [main]

concurrency:
  # Only a PR's runs share a group; runs on main never cancel each other.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-polyml
        id: polyml

      - uses: ./.github/actions/setup-holbuild
        id: holbuild
        with:
          holbuild-ref: v0.14.16

      - name: Report holbuild version
        run: holbuild --version

      - name: Test compiler artifact exporter
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Configure holbuild cache
        run: echo "HOLBUILD_CACHE=$HOME/.cache/holbuild" >> "$GITHUB_ENV"

      # Add SOLIDITY_PIN to the hashed inputs once the build reads it (today
      # only docs, a comment and tools/export_solc_artifacts.py do).
      - name: Compute cache keys
        id: cache-key
        run: |
          toolchain_key="holbuild-v1-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ steps.polyml.outputs.polyml-rev }}-${{ steps.holbuild.outputs.holbuild-rev }}"
          build_prefix="holbuild-v1-project-${{ runner.os }}-${{ runner.arch }}-${{ steps.polyml.outputs.polyml-rev }}-${{ steps.holbuild.outputs.holbuild-rev }}-${{ hashFiles('holproject.toml') }}"
          snapshot_key="${build_prefix}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
          echo "toolchain-key=$toolchain_key" >> "$GITHUB_OUTPUT"
          echo "build-prefix=$build_prefix" >> "$GITHUB_OUTPUT"
          echo "snapshot-key=$snapshot_key" >> "$GITHUB_OUTPUT"

      - name: Restore latest compatible project snapshot
        id: cache-project
        if: ${{ !inputs.skip-snapshot }}
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/holbuild
          key: ${{ steps.cache-key.outputs.snapshot-key }}
          restore-keys: |
            ${{ steps.cache-key.outputs.build-prefix }}-

      - name: Restore toolchain cache
        id: cache-toolchain
        # The toolchain entry holds the whole cache it was saved from, theories
        # included, so skip-snapshot skips it too.
        if: ${{ !inputs.skip-snapshot && steps.cache-project.outputs.cache-matched-key == '' }}
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/holbuild
          key: ${{ steps.cache-key.outputs.toolchain-key }}

      - name: Report restored caches
        env:
          PROJECT_CACHE_HIT: ${{ steps.cache-project.outputs.cache-hit }}
          PROJECT_CACHE_KEY: ${{ steps.cache-project.outputs.cache-matched-key }}
          TOOLCHAIN_CACHE_HIT: ${{ steps.cache-toolchain.outputs.cache-hit }}
          TOOLCHAIN_CACHE_KEY: ${{ steps.cache-toolchain.outputs.cache-matched-key }}
        run: |
          echo "project cache hit: ${PROJECT_CACHE_HIT:-false}"
          echo "project cache key: ${PROJECT_CACHE_KEY:-<none>}"
          echo "toolchain cache hit: ${TOOLCHAIN_CACHE_HIT:-false}"
          echo "toolchain cache key: ${TOOLCHAIN_CACHE_KEY:-<none>}"

      # On a snapshot miss, buildhol and the builds fetch from the remote what
      # other runs published, and publish what they build. Only main (pushes
      # and dispatches), merge groups and PRs from this repository's branches
      # get the login; fork PRs build without the remote.
      - name: Configure remote cache
        uses: ./.github/actions/setup-remote-cache
        with:
          curl-config: ${{ ((github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')) || (github.event_name == 'merge_group' && github.event.merge_group.base_ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) && secrets.HOLBUILD_REMOTE_CACHE_CURL_CONFIG || '' }}

      - name: Build HOL toolchain
        run: |
          set -o pipefail
          holbuild buildhol 2>&1 | tee -a "$RUNNER_TEMP/holbuild.log"

      - name: Save toolchain cache
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: ~/.cache/holbuild
          key: ${{ steps.cache-key.outputs.toolchain-key }}

      # A cached corpus theory was built from identical inputs, so it is
      # accepted rather than rebuilt; failures are never cached.
      - name: Run differential regression corpus
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set -o pipefail
          python3 tools/run_differential.py -j"$(nproc)" --allow-cached \
            --report-dir "$RUNNER_TEMP/differential-report" \
            -- --skip-checkpoints --skip-proof-steps 2>&1 | tee -a "$RUNNER_TEMP/holbuild.log"

      - name: Upload differential report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: differential-report
          path: ${{ runner.temp }}/differential-report
          if-no-files-found: ignore

      - name: Build project roll-up
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set -o pipefail
          holbuild --verbose -j"$(nproc)" build --skip-checkpoints --skip-proof-steps solidityHolTheory \
            2>&1 | tee -a "$RUNNER_TEMP/holbuild.log"

      - name: Report holbuild cache use
        if: always()
        run: |
          log="$RUNNER_TEMP/holbuild.log"
          touch "$log"
          # Distinct lines, so a theory built twice or a key both prefetched and
          # hydrated counts once.
          count() { grep -E -- "$1" "$log" | sed -E 's/ in [0-9.]+s$//; s/^remote cache (hydrated|prefetched):/remote cache fetched:/' | sort -u | grep -c . || true; }
          warnings=$(grep -E '^holbuild: warning: .*remote' "$log" || true)
          remote=off
          [ -n "${HOLBUILD_REMOTE_CACHE_URL:-}" ] && remote=on
          {
            echo '## holbuild cache use'
            echo '| remote cache | theories built | theories restored from cache (incl. fetched) | fetched from remote | remote misses | published to remote | remote cache warnings |'
            echo '| -- | -- | -- | -- | -- | -- | -- |'
            echo "| $remote | $(count '^[^ ]+Theory built( in |$)') | $(count '^[^ ]+Theory restored from cache( in |$)') | $(count '^remote cache (hydrated|prefetched): ') | $(count '^remote cache miss: ') | $(count '^remote cache published: ') | $(printf '%s' "$warnings" | grep -c . || true) |"
          } >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$warnings" | sed -n 's/^./::warning::&/p'

      - name: Save project snapshot
        if: always()
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: ~/.cache/holbuild
          key: ${{ steps.cache-key.outputs.snapshot-key }}

      - name: Verify no checkpoints remain
        run: |
          if find .holbuild/checkpoints \( -name '*.save' -o -name '*.save.ok' \) 2>/dev/null | grep -q .; then
            echo "checkpoint files remained after holbuild run" >&2
            find .holbuild/checkpoints \( -name '*.save' -o -name '*.save.ok' \) 2>/dev/null | head -50 >&2
            exit 1
          fi

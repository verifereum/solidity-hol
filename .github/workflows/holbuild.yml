name: holbuild

on:
  workflow_dispatch:
  pull_request:
  merge_group:
  push:
    branches: [main, bot/opus/solidity-e2e]

concurrency:
  # Only PR runs share a group; branch runs never cancel each other.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: build (corpus shard ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-polyml
        id: polyml

      - uses: ./.github/actions/setup-holbuild
        id: holbuild
        with:
          holbuild-ref: v0.13.18

      - name: Report holbuild version
        run: holbuild --version

      - name: Test compiler artifact exporter
        if: matrix.shard == 0
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Configure holbuild cache
        run: echo "HOLBUILD_CACHE=$HOME/.cache/holbuild" >> "$GITHUB_ENV"

      # Add SOLIDITY_PIN to the hashed inputs once the build reads it (today
      # only docs, a comment and tools/export_solc_artifacts.py do).
      - name: Compute cache keys
        id: cache-key
        run: |
          toolchain_key="holbuild-v1-toolchain-${{ runner.os }}-${{ runner.arch }}-${{ steps.polyml.outputs.polyml-rev }}-${{ steps.holbuild.outputs.holbuild-rev }}"
          project_prefix="holbuild-v2-project-${{ runner.os }}-${{ runner.arch }}-${{ steps.polyml.outputs.polyml-rev }}-${{ steps.holbuild.outputs.holbuild-rev }}-${{ hashFiles('holproject.toml') }}"
          # Migration fallback; remove after active branches have v2 shard snapshots.
          legacy_prefix="holbuild-v1-project-${{ runner.os }}-${{ runner.arch }}-${{ steps.polyml.outputs.polyml-rev }}-${{ steps.holbuild.outputs.holbuild-rev }}-${{ hashFiles('holproject.toml') }}"
          build_prefix="${project_prefix}-shard-${{ matrix.shard }}"
          snapshot_key="${build_prefix}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}"
          echo "toolchain-key=$toolchain_key" >> "$GITHUB_OUTPUT"
          echo "project-prefix=$project_prefix" >> "$GITHUB_OUTPUT"
          echo "legacy-prefix=$legacy_prefix" >> "$GITHUB_OUTPUT"
          echo "build-prefix=$build_prefix" >> "$GITHUB_OUTPUT"
          echo "snapshot-key=$snapshot_key" >> "$GITHUB_OUTPUT"

      - name: Restore latest compatible project snapshot
        id: cache-project
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/holbuild
          key: ${{ steps.cache-key.outputs.snapshot-key }}
          restore-keys: |
            ${{ steps.cache-key.outputs.build-prefix }}-
            ${{ steps.cache-key.outputs.project-prefix }}-
            ${{ steps.cache-key.outputs.legacy-prefix }}-

      - name: Restore toolchain cache
        id: cache-toolchain
        if: steps.cache-project.outputs.cache-matched-key == ''
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/holbuild
          key: ${{ steps.cache-key.outputs.toolchain-key }}

      - name: Report restored caches
        env:
          PROJECT_CACHE_HIT: ${{ steps.cache-project.outputs.cache-hit }}
          PROJECT_CACHE_KEY: ${{ steps.cache-project.outputs.cache-matched-key }}
          TOOLCHAIN_CACHE_HIT: ${{ steps.cache-toolchain.outputs.cache-hit }}
          TOOLCHAIN_CACHE_KEY: ${{ steps.cache-toolchain.outputs.cache-matched-key }}
        run: |
          echo "project cache hit: ${PROJECT_CACHE_HIT:-false}"
          echo "project cache key: ${PROJECT_CACHE_KEY:-<none>}"
          echo "toolchain cache hit: ${TOOLCHAIN_CACHE_HIT:-false}"
          echo "toolchain cache key: ${TOOLCHAIN_CACHE_KEY:-<none>}"

      - name: Build HOL toolchain
        run: holbuild buildhol

      - name: Save toolchain cache
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: ~/.cache/holbuild
          key: ${{ steps.cache-key.outputs.toolchain-key }}

      # A cached corpus theory was built from identical inputs, so it is
      # accepted rather than rebuilt; failures are never cached.
      - name: Run differential regression corpus
        env:
          TMPDIR: ${{ runner.temp }}
        run: >-
          /usr/bin/time -v python3 tools/run_differential.py -j2 --allow-cached
          --shard-count 8 --shard-index ${{ matrix.shard }}
          --report-dir "$RUNNER_TEMP/differential-report"
          -- --max-heap 6000 --skip-checkpoints --skip-proof-steps

      - name: Upload differential report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: differential-report-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/differential-report
          if-no-files-found: ignore

      - name: Build project roll-up excluding sharded corpus
        if: matrix.shard == 0
        env:
          TMPDIR: ${{ runner.temp }}
        run: holbuild --verbose -j"$(nproc)" build --skip-checkpoints --skip-proof-steps solidityHolBaseTheory

      - name: Save project snapshot
        if: always()
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: ~/.cache/holbuild
          key: ${{ steps.cache-key.outputs.snapshot-key }}

      - name: Verify no checkpoints remain
        run: |
          if find .holbuild/checkpoints \( -name '*.save' -o -name '*.save.ok' \) 2>/dev/null | grep -q .; then
            echo "checkpoint files remained after holbuild run" >&2
            find .holbuild/checkpoints \( -name '*.save' -o -name '*.save.ok' \) 2>/dev/null | head -50 >&2
            exit 1
          fi
